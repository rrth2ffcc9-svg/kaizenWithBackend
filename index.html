<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доска кайдзен-предложений — УСМ-Инжиниринг</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="ООО УСМ-Инжиниринг">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="none" stroke="#1e3a8a" stroke-width="2"/></svg>
      </span>
      <span class="brand__text"><b>ООО УСМ-Инжиниринг</b><small>Система непрерывных улучшений</small></span>
    </a>
    <div class="topbar__actions">
      <label class="search">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2"/></svg>
        <input id="search" type="search" placeholder="Поиск предложений…" aria-label="Поиск предложений" autocomplete="off">
      </label>
      <button class="btn btn--light" id="btn-new" type="button"><span aria-hidden="true">+</span> Новое предложение</button>
      <span class="avatar avatar--sm" title="Администратор интерфейса">АИ</span>
    </div>
  </header>

  <main class="page">
    <nav class="breadcrumbs" aria-label="Навигация">
      <a href="#">Главная</a> / <a href="#">Непрерывные улучшения</a> / <span aria-current="page">Доска предложений</span>
    </nav>

    <div class="page__head">
      <h1>Доска кайдзен-предложений</h1>
      <div class="period-chip" id="period-chip">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/></svg>
        <span id="period-chip-text"></span>
      </div>
    </div>

    <section class="kpis" id="kpis" aria-label="Ключевые показатели"></section>

    <section class="filters" aria-label="Фильтры">
      <label>Отдел: <select id="f-dept"></select></label>
      <label>Категория: <select id="f-cat"></select></label>
      <label>Период: <select id="f-period"></select></label>
      <div class="seg" role="group" aria-label="Вид">
        <button type="button" id="v-board" class="is-active" aria-pressed="true">Доска</button>
        <button type="button" id="v-list" aria-pressed="false">Список</button>
      </div>
    </section>

    <div id="move-hint" class="move-hint" hidden></div>
    <div id="view"></div>
  </main>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
